name: whip-aar

on:
  push:
    branches: [yugipc-whip]
    paths:
      - 'whip/**'
      - '.github/workflows/whip.yml'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon --configure-on-demand :whip:testReleaseUnitTest

      - name: Build AAR
        run: ./gradlew --no-daemon --configure-on-demand :whip:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: yugipc-whip-aar
          path: whip/build/outputs/aar/*.aar
